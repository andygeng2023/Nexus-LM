name: C++ build and tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and CMake
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Configure
        run: |
          TORCH_PREFIX=$(python -c "import torch; print(torch.utils.cmake_prefix_path)")
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$TORCH_PREFIX" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end tokenizer and training smoke test
        run: |
          ./build/nexus tokenizer-train examples/tiny_corpus.txt build/smoke.bpe 280
          ./build/nexus train examples/tiny_corpus.txt build/smoke.pt build/smoke.bpe 1 16 1
          ./build/nexus generate build/smoke.pt build/smoke.bpe "NEXUS" 2
      - name: Benchmark smoke test
        run: ./build/nexus_bench 16 1
