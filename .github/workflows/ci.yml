name: C++ build and tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and CMake
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Configure
        run: |
          TORCH_PREFIX=$(python -c "import torch; print(torch.utils.cmake_prefix_path)")
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$TORCH_PREFIX" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Browser runtime tests
        run: node --test tests/web-runtime.test.js
      - name: End-to-end tokenizer, train, evaluate and generation smoke test
        run: |
          ./build/nexus tokenizer-train examples/tiny_corpus.txt build/smoke.bpe 280 200000
          ./build/nexus train examples/tiny_corpus.txt build/smoke.pt build/smoke.bpe 1 16 1
          ./build/nexus evaluate build/smoke.pt build/smoke.bpe examples/tiny_corpus.txt 2
          ./build/nexus generate build/smoke.pt build/smoke.bpe "NEXUS" 2
          ./build/nexus_export_web build/smoke.pt build/smoke.bpe build/web-model
          node -e "const m=require('./build/web-model/model.json'); if(m.format!=='NEXUS_WEB_V1'||!m.tensors.length) process.exit(1)"
          node --input-type=module -e 'import fs from "node:fs"; import {NexusRuntime} from "./web/runtime.js"; const b=fs.readFileSync("build/web-model/model.bin"); const raw=b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength); const model=new NexusRuntime(JSON.parse(fs.readFileSync("build/web-model/model.json","utf8")),raw,fs.readFileSync("build/web-model/tokenizer.bpe","utf8")); if(model.logits(model.encode("NEXUS")).length!==model.cfg.vocab_size) process.exit(1)'
      - name: Benchmark smoke test
        run: ./build/nexus_bench 16 1
