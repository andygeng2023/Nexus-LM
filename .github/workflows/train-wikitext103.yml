name: Train NEXUS on WikiText-103

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps (250 is a quick CPU smoke test; 10000 maximum)
        required: true
        default: "250"
        type: string
      sequence_length:
        description: Context length per training example (shorter contexts train faster)
        required: true
        default: "128"
        type: choice
        options:
          - "128"
          - "256"
      batch_size:
        description: Batch size (larger batches increase CPU cost)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      vocab_size:
        description: BPE vocabulary size
        required: true
        default: "1024"
        type: choice
        options:
          - "512"
          - "1024"
          - "2048"
      sample_bytes:
        description: Bytes sampled from train split for BPE fitting
        required: true
        default: "200000"
        type: choice
        options:
          - "100000"
          - "200000"
          - "500000"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU LibTorch and CMake
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3.3,<5"
      - name: Download and verify WikiText-103
        run: python3 scripts/prepare_wikitext103.py
      - name: Configure and build
        run: |
          TORCH_PREFIX=$(python -c "import torch; print(torch.utils.cmake_prefix_path)")
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$TORCH_PREFIX" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Train tokenizer
        env:
          VOCAB_SIZE: ${{ inputs.vocab_size || '1024' }}
          SAMPLE_BYTES: ${{ inputs.sample_bytes || '200000' }}
        run: |
          mkdir -p checkpoints
          ./build/nexus tokenizer-train data/wikitext-103/train.txt checkpoints/wikitext103.bpe "$VOCAB_SIZE" "$SAMPLE_BYTES"
      - name: Train and validate NEXUS
        env:
          STEPS: ${{ inputs.steps || '2000' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '256' }}
          BATCH_SIZE: ${{ inputs.batch_size || '1' }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 1 || STEPS > 10000 )); then
            echo "STEPS must be between 1 and 10000" >&2
            exit 2
          fi
          ./build/nexus train data/wikitext-103/train.txt checkpoints/nexus-wikitext103.pt checkpoints/wikitext103.bpe "$STEPS" "$SEQUENCE_LENGTH" "$BATCH_SIZE" data/wikitext-103/validation.txt 2>&1 | tee checkpoints/training.log
      - name: Evaluate held-out test split
        run: |
          ./build/nexus evaluate checkpoints/nexus-wikitext103.pt checkpoints/wikitext103.bpe data/wikitext-103/test.txt 256 2>&1 | tee checkpoints/evaluation.log
      - name: Export browser-compatible model
        run: ./build/nexus_export_web checkpoints/nexus-wikitext103.pt checkpoints/wikitext103.bpe web-model
      - name: Upload checkpoint, tokenizer, browser model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: nexus-wikitext103-checkpoint
          path: |
            checkpoints/nexus-wikitext103.pt
            checkpoints/wikitext103.bpe
            checkpoints/training.log
            checkpoints/evaluation.log
            web-model/model.json
            web-model/model.bin
            web-model/tokenizer.bpe
            data/wikitext-103/DATASET-ATTRIBUTION.txt
          if-no-files-found: error
          retention-days: 30
